name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          IFS=',' read -ra TARGETS <<< "${{ matrix.rust_targets }}"
          for target in "${TARGETS[@]}"; do
            cargo build --release --locked --target "$target"
          done

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            lipo -create -output dist/libgen-tui \
              target/x86_64-apple-darwin/release/libgen-tui \
              target/aarch64-apple-darwin/release/libgen-tui
            lipo -info dist/libgen-tui
          elif [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.rust_targets }}/release/libgen-tui.exe" dist/
          else
            cp "target/${{ matrix.rust_targets }}/release/libgen-tui" dist/
          fi

      - name: Package
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          STAGE="libgen-tui-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp dist/* "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$STAGE.zip" "$STAGE"
            echo "ASSET=$STAGE.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$STAGE.tar.gz" "$STAGE"
            echo "ASSET=$STAGE.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
