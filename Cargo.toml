[package]
name = "libgen-tui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "terminal user interface for libgen (library genesis) to download ebooks over the internet from the terminal"
repository = "https://github.com/Houdiee/libgen-tui"

[package.metadata.deb]
maintainer = "Houdiee <kerimugurlu24@gmail.com>"
copyright = "2025, Houdiee Tan <kerimugurlu24@gmail.com>"
depends = "$auto"
license-file = [ "LICENSE", "3" ]

[package.metadata.generate-rpm]
assets = [ { source = "target/release/libgen-tui", dest = "/usr/bin/libgen-tui", mode = "755" } ]

[dependencies]
colored = "3.0.0"
config = "0.15.11"
dirs = "6.0.0"
env_logger = "0.11.8"
futures = "0.3.31"
log = "0.4.27"
ratatui = "0.29.0"
reqwest = { version = "0.12.15", default-features = false, features = ["rustls-tls", "charset", "macos-system-configuration"] }
scraper = "0.23.1"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
toml = "0.8.20"
tui-textarea = "0.7.0"
urlencoding = "2.1.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
